# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
# drafted from ./<domain>.schema.example.yml
---
title: <domain>

# top level should almost always be object
type: object

# default to closed set of properties
additionalProperties: false

# allow docker-compose.yml style explicit extension properties
patternProperties:
  ^x-: {}

# default to making all properties required
required:
  - dogs

# yml anchors should be extracted into $defs
$defs:
  audit:
    type: object
    required:
      - updated-at
    properties:
      updated-at:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"

properties:
  dogs:
    type: array
    items:
      type: object
      allOf:
        - $ref: "#/$defs/audit"
        - type: object
          required:
            - name
            - breed
          properties:
            name:
              type: string
            breed:
              enum:
                - wiener
                - schnauzer
                - pomeranian
                - poodle-shaped
      unevaluatedProperties: false
  locations:
    type: array
    items:
      type: object
      allOf:
        - $ref: "#/$defs/audit"
        - type: object
          required:
            - home
          properties:
            home:
              type: string
      unevaluatedProperties: false

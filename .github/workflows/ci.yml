# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
on:
  push:
  schedule:
    - cron: "0 0 * * *" # daily

jobs:
  ubuntu:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4

      - run: |-
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends s6 execline rsync

      - run: |-
          gmake lint test

      - run: |-
          gmake fmt
          git diff --exit-code
